name: Fiscal receipt integration - publication OFF
on:
  push:
    branches: [codex/final-fiscal-receipt]
    paths: ['arca.js', 'tests/arca-*.cjs', '.github/workflows/final-fiscal-receipt.yml']
permissions:
  contents: read
jobs:
  focused:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/arca-receipt-summary.test.cjs tests/arca-completion.test.cjs tests/arca-ui-integration.test.cjs
  receipt-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/arca-receipt-browser.cjs
