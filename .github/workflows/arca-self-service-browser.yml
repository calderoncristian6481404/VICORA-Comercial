name: ARCA Self-Service Browser
on:
  push:
    branches:
      - feature/arca-alta-autoservicio-20261120
  pull_request:
    paths:
      - 'arca.js'
      - 'tests/arca-enrollment.test.cjs'
      - '.github/workflows/arca-self-service-browser.yml'
permissions:
  contents: read
jobs:
  browser-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/arca-enrollment.test.cjs tests/arca.test.cjs
