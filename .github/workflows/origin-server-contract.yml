name: Origin server client contract
on:
  push:
    branches: [codex/api-fiscal-integrada]
    paths: ['server/**','tests/origin_client_test.py','.github/workflows/origin-server-contract.yml']
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B tests/origin_client_test.py
