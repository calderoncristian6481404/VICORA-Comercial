name: ARCA production UI review (non-emitting)
on:
  push:
    branches: [integracion/arca-comprobante-produccion-20261121]
    paths:
      - 'arca.js'
      - 'tests/arca-completion.test.cjs'
      - 'tests/arca-ui-integration.test.cjs'
      - '.github/workflows/arca-prod-ui-review.yml'
  pull_request:
    paths:
      - 'arca.js'
      - 'tests/arca-completion.test.cjs'
      - 'tests/arca-ui-integration.test.cjs'
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check arca.js
      - run: node --test tests/arca-completion.test.cjs tests/arca-ui-integration.test.cjs tests/arca-enrollment.test.cjs tests/arca.test.cjs tests/optional-receipts.test.cjs
