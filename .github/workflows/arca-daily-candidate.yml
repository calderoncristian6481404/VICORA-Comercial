name: Optional fiscal daily candidate
on:
  push:
    branches: [codex/operacion-cotidiana-20261126]
  pull_request:
    paths: ['arca.js', 'tests/arca*.cjs', '.github/workflows/arca-daily-candidate.yml']
permissions:
  contents: read
jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check arca.js
      - run: node tests/arca-daily.test.cjs
      - run: node tests/arca-credit-c.test.cjs
      - run: node tests/arca.test.cjs
      - run: node tests/arca-completion.test.cjs
      - run: node tests/arca-enrollment.test.cjs
      - run: node tests/arca-onboarding-readiness.test.cjs
      - run: node tests/arca-ui-integration.test.cjs
