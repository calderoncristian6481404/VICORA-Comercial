name: Commercial source authority contract review
on:
  push:
    branches: [codex/api-fiscal-integrada]
    paths: ['ventas.js','tests/optional-receipts.test.cjs','ARCA_SOURCE_INVENTORY.json','tests/server-authority-contract.test.cjs','.github/workflows/commercial-authority-contract.yml']
permissions:
  contents: read
jobs:
  reviewed_contract:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node tests/server-authority-contract.test.cjs
      - run: node tests/optional-receipts.test.cjs
