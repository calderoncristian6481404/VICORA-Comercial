name: Optional fiscal completion client (offline)
on:
  push:
    branches: [codex/api-fiscal-integrada]
    paths: ['ventas.js','tests/optional-receipts.test.cjs','tests/arca-ui-integration.test.cjs','arca.js','tests/arca-completion.test.cjs','.github/workflows/arca-completion-focused.yml']
permissions:
  contents: read
jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check arca.js
      - run: node --check ventas.js
      - run: node tests/arca-ui-integration.test.cjs
      - run: node tests/arca-completion.test.cjs
      - run: node tests/arca.test.cjs
      - run: node tests/optional-receipts.test.cjs
