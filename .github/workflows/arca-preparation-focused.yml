name: ARCA preparation client focused
on:
  push:
    branches: [codex/api-fiscal-integrada]
    paths: ['arca.js','arca.config.js','ventas.js','index.html','tests/arca.test.cjs','tests/arca-closure.test.cjs','.github/workflows/arca-preparation-focused.yml']
permissions:
  contents: read
jobs:
  client:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check ventas.js
      - run: node --check arca.js
      - run: node tests/arca.test.cjs
      - run: node tests/arca-closure.test.cjs
