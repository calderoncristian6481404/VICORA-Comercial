name: VICORA subscription expiry and global read-only
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'solo_lectura.js'
      - 'ventas.js'
      - 'compras.js'
      - 'proveedores.js'
      - 'pagos.js'
      - 'cobros.js'
      - 'caja.js'
      - 'gastos.js'
      - 'presupuestos.js'
      - 'DB/MIGRACIONES/20261112_guardia_suscripcion_escrituras.sql'
      - 'tests/suscripcion_guard.test.cjs'
      - 'tests/solo_lectura_global.test.cjs'
      - '.github/workflows/verify-subscription-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  subscription-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify syntax of all operational scripts
        shell: bash
        run: |
          for script in solo_lectura ventas compras proveedores pagos cobros caja gastos presupuestos; do
            node --check "${script}.js"
          done
      - name: Subscription date, read-only mode and DB security regression (offline)
        run: node --test tests/suscripcion_guard.test.cjs tests/solo_lectura_global.test.cjs
