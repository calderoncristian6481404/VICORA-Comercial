<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VICORA Comercial</title><style>

    /* =====================================================
       ESTILO GENERAL
       ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;

      background:
        linear-gradient(
          135deg,
          #f5f7ff 0%,
          #f8fafc 50%,
          #eef6ff 100%
        );

      color: #111827;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }


    /* =====================================================
       LOGIN
       ===================================================== */

   #loginScreen {
  min-height: 100vh;

  display: flex;
  align-items: flex-start;
  justify-content: center;

  padding: 70px 20px 20px;

  background:
    linear-gradient(
      135deg,
      #172554 0%,
      #1e3a8a 50%,
      #1d4ed8 100%
    );
}

.login-card {
  width: 100%;
  max-width: 420px;

  background: rgba(255,255,255,.96);

  border-radius: 24px;

  padding: 38px;

  box-shadow:
    0 25px 70px rgba(15,23,42,.14),
    0 4px 12px rgba(15,23,42,.05);

  border: 1px solid rgba(255,255,255,.8);

  backdrop-filter: blur(10px);
}
    .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      width: max-content;
      max-width: 100%;
      gap: 14px;
      margin: 0 auto 18px;
    }

    .login-brand-logo {
      width: 76px;
      height: 76px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 8px 16px rgba(15,23,42,.22));
    }

    .login-title {
      text-align: left;
      font-size: 27px;
      font-weight: 800;
      color: #172554;
      margin: 0;
    }

    .login-subtitle {
  text-align: center;

  font-size: 14px;

  color: #64748b;

  margin-bottom: 25px;
}

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
  display: block;

  margin-bottom: 7px;

  font-size: 13px;

  font-weight: 700;

  color: #1e293b;
}

    .form-control {
      width: 100%;

      border: 1px solid #d7dce5;

      border-radius: 10px;

      padding: 12px 13px;

      font-size: 14px;

      outline: none;

      transition:
        border-color .2s,
        box-shadow .2s,
        transform .2s;

      background: #ffffff;
    }

    .form-control:hover {
      border-color: #b8c1d1;
    }

    .form-control:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 4px rgba(37,99,235,.10);
    }

    .login-button {
      width: 100%;

      border: 0;

      border-radius: 10px;

      padding: 13px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #4f46e5
        );

      color: white;

      font-weight: 700;
      font-size: 14px;

      margin-top: 5px;

      box-shadow:
        0 8px 18px rgba(37,99,235,.22);

      transition:
        transform .2s,
        box-shadow .2s;
    }

    .login-button:hover {
      background:
        linear-gradient(
          135deg,
          #1d4ed8,
          #4338ca
        );

      transform: translateY(-1px);

      box-shadow:
        0 12px 22px rgba(37,99,235,.28);
    }

    .login-button:disabled {
      opacity: .7;
      cursor: wait;
      transform: none;
    }

    .login-error {
      display: none;

      margin-bottom: 15px;

      padding: 11px;

      border-radius: 9px;

      background: #fee2e2;

      color: #991b1b;

      border: 1px solid #fecaca;

      font-size: 13px;
    }


    /* =====================================================
       SISTEMA
       ===================================================== */

    #sistema {
      display: none;
      min-height: 100vh;
    }

    /* =====================================================
   BARRA SUPERIOR
   ===================================================== */

.topbar {
  position: fixed;

  top: 0;
  left: 0;
  right: 0;

  height: 68px;

  background:
    linear-gradient(
      135deg,
      #172554 0%,
      #1e3a8a 50%,
      #1d4ed8 100%
    );

  border-bottom:
    1px solid rgba(255,255,255,.12);

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 24px;

  z-index: 100;

  box-shadow:
    0 4px 18px rgba(15,23,42,.20);
}


/* =====================================================
   MARCA VICORA
   ===================================================== */

.app-brand {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 190px;
}

.app-brand-logo {
  width: 42px;
  height: 42px;
  object-fit: contain;
  flex-shrink: 0;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,.20));
}

.app-brand-name {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1.2px;
  color: #ffffff;
  text-shadow:
    -1px -1px 0 rgba(0,0,0,.45),
     1px -1px 0 rgba(0,0,0,.45),
    -1px  1px 0 rgba(0,0,0,.45),
     1px  1px 0 rgba(0,0,0,.45);
}

/* =====================================================
   NOMBRE DEL NEGOCIO
   ===================================================== */

.business-name {
  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  text-align: center;

  font-size: 22px;

  font-weight: 800;

  color: #ffffff;

  letter-spacing: .2px;

  white-space: nowrap;

  text-shadow:
    -1px -1px 0 #000,
     1px -1px 0 #000,
    -1px  1px 0 #000,
     1px  1px 0 #000,
     0 2px 5px rgba(0,0,0,.25);
}

/* =====================================================
   USUARIO
   ===================================================== */

.user-area {
  min-width: 220px;

  display: flex;

  justify-content: flex-end;
  align-items: center;

  gap: 10px;
}

.user-info {
  text-align: right;
}

.user-name {
  font-size: 13px;

  font-weight: 700;

  color: #ffffff;
}

.user-role {
  font-size: 11px;

  color: #bfdbfe;

  margin-top: 2px;
}


/* =====================================================
   AVATAR
   ===================================================== */

.avatar {
  width: 40px;
  height: 40px;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #60a5fa,
      #818cf8
    );

  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: 800;

  border:
    2px solid rgba(255,255,255,.35);

  box-shadow:
    0 5px 14px rgba(0,0,0,.20);
}

    /* =====================================================
   NOMBRE DEL NEGOCIO
   ===================================================== */

.business-name::after {
  content: "";

  display: block;

  width: 55px;
  height: 3px;

  margin: 5px auto 0;

  border-radius: 10px;

  background:
    linear-gradient(
      90deg,
      #93c5fd,
      #dbeafe
    );

  box-shadow:
    0 1px 5px rgba(147,197,253,.35);
}


/* =====================================================
   USUARIO
   ===================================================== */

.user-name {
  font-size: 13px;

  font-weight: 700;

  color: #ffffff;

  /* Contorno negro */
  text-shadow:
    -1px -1px 0 #000,
     1px -1px 0 #000,
    -1px  1px 0 #000,
     1px  1px 0 #000,
     0 1px 3px rgba(0,0,0,.35);
}


/* =====================================================
   ROL
   ===================================================== */

.user-role {
  font-size: 11px;

  color: #ffffff;

  margin-top: 2px;

  /* Contorno negro */
  text-shadow:
    -1px -1px 0 #000,
     1px -1px 0 #000,
    -1px  1px 0 #000,
     1px  1px 0 #000,
     0 1px 3px rgba(0,0,0,.35);
}

    /* =====================================================
       SIDEBAR
       ===================================================== */

    .sidebar {
      position: fixed;

      top: 68px;
      bottom: 0;
      left: 0;

      width: 235px;

      background:
        linear-gradient(
          180deg,
          #111827 0%,
          #172033 55%,
          #0f172a 100%
        );

      padding: 20px 12px;

      overflow-y: auto;

      z-index: 90;

      box-shadow:
        5px 0 20px rgba(15,23,42,.10);
    }

    .menu-title {
      color: #94a3b8;

      font-size: 10px;

      font-weight: 800;

      text-transform: uppercase;

      padding: 8px 12px;

      letter-spacing: .8px;
    }

    .menu-item {
      width: 100%;

      border: 0;

      background: transparent;

      color: #cbd5e1;

      padding: 11px 13px;

      border-radius: 9px;

      display: flex;
      align-items: center;

      gap: 11px;

      margin-bottom: 5px;

      text-align: left;

      font-size: 13px;

      transition:
        background .2s,
        color .2s,
        transform .2s;
    }

    .menu-item:hover {
      background: rgba(255,255,255,.08);

      color: white;

      transform: translateX(2px);
    }

    .menu-item.active {
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #4f46e5
        );

      color: white;

      box-shadow:
        0 7px 15px rgba(37,99,235,.22);
    }

    .menu-icon {
      width: 22px;

      text-align: center;

      font-size: 17px;
    }

    .logout-button {
      margin-top: 25px;

      padding-top: 15px;

      border-top:
        1px solid #374151;
    }

    .logout-button .menu-item {
      color: #fca5a5;
    }

    .logout-button .menu-item:hover {
      background: #7f1d1d;

      color: white;

      transform: none;
    }


    /* =====================================================
       CONTENIDO
       ===================================================== */

    .main {
      margin-left: 235px;

      padding:
        96px 30px 35px;

      min-height: 100vh;
    }

    .page-title {
      font-size: 27px;

      font-weight: 800;

      margin-bottom: 5px;

      color: #0f172a;

      letter-spacing: -.4px;
    }

    .page-subtitle {
      color: #64748b;

      font-size: 14px;

      margin-bottom: 25px;
    }


    /* =====================================================
       DASHBOARD
       ===================================================== */

    .dashboard-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 18px;

      margin-bottom: 24px;
    }

    .dashboard-card {
      position: relative;

      overflow: hidden;

      background: white;

      border:
        1px solid #e5e7eb;

      border-radius: 16px;

      padding: 20px;

      box-shadow:
        0 5px 18px rgba(15,23,42,.05);

      transition:
        transform .2s,
        box-shadow .2s;
    }

    .dashboard-card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 4px;

      background:
        linear-gradient(
          90deg,
          #2563eb,
          #4f46e5
        );
    }

    .dashboard-card:hover {
      transform: translateY(-3px);

      box-shadow:
        0 12px 25px rgba(15,23,42,.09);
    }

    .dashboard-card-header {
      display: flex;

      align-items: center;

      justify-content: space-between;
    }

    .dashboard-card-label {
      color: #64748b;

      font-size: 13px;

      margin-bottom: 8px;

      font-weight: 600;
    }

    .dashboard-card-value {
      font-size: 29px;

      font-weight: 800;

      color: #0f172a;
    }

    .dashboard-card-icon {
      width: 48px;
      height: 48px;

      border-radius: 13px;

      background: #eff6ff;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 22px;

      box-shadow:
        inset 0 0 0 1px rgba(37,99,235,.06);
    }


    /* =====================================================
       CARDS
       ===================================================== */

    .card {
      background: white;

      border:
        1px solid #e5e7eb;

      border-radius: 16px;

      padding: 22px;

      box-shadow:
        0 5px 18px rgba(15,23,42,.045);
    }

    .card-title {
      font-size: 17px;

      font-weight: 800;

      margin-bottom: 8px;

      color: #1e293b;
    }


    /* =====================================================
       MODULOS
       ===================================================== */

    .module-header {
      display: flex;

      justify-content: space-between;

      align-items: flex-end;

      gap: 20px;

      margin-bottom: 20px;
    }

    .module-header .page-subtitle {
      margin-bottom: 0;
    }

    .module-actions {
      display: flex;

      gap: 10px;

      align-items: center;
    }

    .search-box input {
      width: 240px;

      border:
        1px solid #d1d5db;

      border-radius: 9px;

      padding: 11px 12px;

      outline: none;

      font-size: 13px;

      background: white;

      transition:
        border-color .2s,
        box-shadow .2s;
    }

    .search-box input:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37,99,235,.08);
    }

    .btn {
      border: 0;

      border-radius: 9px;

      padding: 11px 15px;

      font-size: 13px;

      font-weight: 700;

      transition:
        transform .2s,
        box-shadow .2s,
        background .2s;
    }

    .btn-primary {
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #4f46e5
        );

      color: white;

      box-shadow:
        0 6px 14px rgba(37,99,235,.18);
    }

    .btn-primary:hover {
      background:
        linear-gradient(
          135deg,
          #1d4ed8,
          #4338ca
        );

      transform: translateY(-1px);

      box-shadow:
        0 9px 18px rgba(37,99,235,.24);
    }

    .btn-primary:disabled {
      opacity: .65;

      cursor: wait;

      transform: none;
    }


    /* =====================================================
       TABLAS
       ===================================================== */

    .table-container {
      overflow-x: auto;

      border-radius: 10px;
    }

    .data-table {
      width: 100%;

      border-collapse: separate;

      border-spacing: 0;

      min-width: 850px;
    }

    .data-table th {
      background: #f1f5f9;

      color: #475569;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: .4px;

      padding: 14px 12px;

      text-align: left;

      border-bottom:
        2px solid #cbd5e1;
    }

    .data-table th:first-child {
      border-top-left-radius: 8px;
    }

    .data-table th:last-child {
      border-top-right-radius: 8px;
    }

    .data-table td {
      padding: 15px 12px;

      font-size: 13px;

      vertical-align: middle;

      color: #334155;

      border-bottom:
        1px solid #dbe3ec;

      background: #ffffff;
    }

    .data-table tbody tr {
      transition:
        background .15s,
        box-shadow .15s;
    }

    .data-table tbody tr:hover td {
      background: #f8fbff;
    }

    .data-table tbody tr:hover td:first-child {
      box-shadow:
        inset 3px 0 0 #2563eb;
    }

    .data-table tbody tr:last-child td {
      border-bottom: none;
    }

    .data-table td strong {
      color: #1e293b;
    }


    /* =====================================================
       ACCIONES
       ===================================================== */

    .actions {
      display: flex;

      gap: 6px;
    }

    .action-btn {
      border: 0;

      width: 32px;
      height: 32px;

      border-radius: 8px;

      display: flex;

      align-items: center;

      justify-content: center;

      transition:
        transform .15s,
        filter .15s;
    }

    .action-btn:hover {
      transform: translateY(-1px);

      filter: brightness(.96);
    }

    .btn-info {
      background: #e0f2fe;
    }

    .btn-warning {
      background: #fef3c7;
    }

    .btn-danger {
      background: #fee2e2;
    }

    .btn-success {
      background: #dcfce7;
    }


    /* =====================================================
       ESTADOS
       ===================================================== */

    .badge {
      display: inline-flex;

      align-items: center;

      padding: 5px 9px;

      border-radius: 999px;

      font-size: 10px;

      font-weight: 800;

      letter-spacing: .2px;
    }

    .badge-active {
      background: #dcfce7;

      color: #166534;
    }

    .badge-inactive {
      background: #fee2e2;

      color: #991b1b;
    }

    .badge-stock-zero {
      background: #fee2e2;

      color: #991b1b;
    }

    .badge-stock-low {
      background: #fef3c7;

      color: #92400e;
    }

    .badge-stock-ok {
      background: #dcfce7;

      color: #166534;
    }


    /* =====================================================
       ESTADO VACIO
       ===================================================== */

    .empty-state {
      text-align: center;

      padding: 55px 20px;

      color: #64748b;
    }

    .empty-state-icon {
      font-size: 42px;

      margin-bottom: 12px;

      opacity: .85;
    }

    .empty-state small {
      display: block;

      margin-top: 8px;

      color: #94a3b8;
    }


    /* =====================================================
       CARGANDO
       ===================================================== */

    .loading {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      padding: 50px;

      color: #64748b;

      font-size: 14px;
    }

    .spinner {
      width: 21px;
      height: 21px;

      border:
        3px solid #e2e8f0;

      border-top-color:
        #2563eb;

      border-radius: 50%;

      animation:
        girar .8s linear infinite;
    }

    @keyframes girar {

      to {
        transform: rotate(360deg);
      }

    }


    /* =====================================================
       MODALES
       ===================================================== */

    .modal {
      display: none;

      position: fixed;

      inset: 0;

      background:
        rgba(15,23,42,.55);

      backdrop-filter:
        blur(3px);

      align-items: center;

      justify-content: center;

      padding: 20px;

      z-index: 500;
    }

    .modal-content {
      width: 100%;

      max-width: 720px;

      max-height: 90vh;

      overflow-y: auto;

      background: white;

      border-radius: 18px;

      box-shadow:
        0 30px 70px rgba(15,23,42,.25);

      border:
        1px solid rgba(255,255,255,.8);

      animation:
        aparecerModal .18s ease-out;
    }

    @keyframes aparecerModal {

      from {
        opacity: 0;

        transform:
          translateY(8px)
          scale(.98);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }

    .modal-header {
      padding: 20px 22px;

      border-bottom:
        1px solid #e5e7eb;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }

    .modal-title {
      font-size: 18px;

      font-weight: 800;

      color: #1e293b;
    }

    .modal-close {
      border: 0;

      background: #f8fafc;

      width: 34px;
      height: 34px;

      border-radius: 8px;

      font-size: 23px;

      color: #64748b;

      transition:
        background .2s,
        color .2s;
    }

    .modal-close:hover {
      background: #fee2e2;

      color: #991b1b;
    }

    .modal-body {
      padding: 22px;
    }

    .modal-footer {
      padding: 15px 22px;

      border-top:
        1px solid #e5e7eb;

      display: flex;

      justify-content: flex-end;

      gap: 9px;

      background: #fafafa;
    }

    .btn-secondary {
      background: #e5e7eb;

      color: #374151;
    }

    .btn-secondary:hover {
      background: #d1d5db;
    }

    .form-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 15px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    textarea.form-control {
      min-height: 90px;

      resize: vertical;
    }


    /* =====================================================
       FICHA
       ===================================================== */

    .ficha-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 14px;
    }

    .ficha-item {
      background:
        linear-gradient(
          135deg,
          #f8fafc,
          #f1f5f9
        );

      border:
        1px solid #e2e8f0;

      border-radius: 10px;

      padding: 14px;
    }

    .ficha-item.full {
      grid-column: 1 / -1;
    }

    .ficha-label {
      display: block;

      font-size: 10px;

      color: #64748b;

      text-transform: uppercase;

      font-weight: 800;

      margin-bottom: 5px;

      letter-spacing: .3px;
    }

    .ficha-value {
      font-size: 14px;

      color: #1e293b;

      font-weight: 600;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 1000px) {

      .dashboard-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .sidebar {
        width: 205px;
      }

      .main {
        margin-left: 205px;
      }

    }


    @media (max-width: 760px) {

      .topbar {
        padding: 0 12px;
      }

      .app-brand {
        min-width: auto;
      }

      .app-brand-logo {
        width: 38px;
        height: 38px;
      }

      .app-brand-name {
        font-size: 17px;
      }

      .business-name {
        font-size: 16px;
      }

      .business-name::after {
        width: 35px;
        height: 2px;
      }

      .user-area {
        min-width: auto;
      }

      .user-info {
        display: none;
      }

      .sidebar {
        width: 68px;

        padding: 15px 8px;
      }

      .menu-title {
        display: none;
      }

      .menu-item {
        justify-content: center;

        padding: 12px 5px;
      }

      .menu-item span:not(.menu-icon) {
        display: none;
      }

      .logout-button {
        border-top: 0;
      }

      .main {
        margin-left: 68px;

        padding:
          88px 15px 25px;
      }

.btn-secondary { background:#f1f5f9 !important; color:#475569 !important; border:1px solid #dce4ec !important; }
.btn-info { background:#eff6ff !important; color:#1d4ed8 !important; border:1px solid #dbeafe !important; }
.btn-warning { background:#fff7ed !important; color:#9a3412 !important; border:1px solid #ffedd5 !important; }
.btn-danger { background:#fff1f2 !important; color:#be123c !important; border:1px solid #ffe4e6 !important; }
.btn-success { background:#ecfdf5 !important; color:#047857 !important; border:1px solid #d1fae5 !important; }

/* VICORA - Ajuste final de colores de acciones (2026-10-12) */
/* Acciones principales: azul original, sin afectar los botones secundarios. */
.vi-client-btn:not(.alt):not(.warn):not(.ok),
.btn-primary,
.vi-client-toolbar > .vi-client-btn:not(.alt),
.vi-prov-toolbar > .vi-client-btn:not(.alt) {
  background:#2563eb !important; color:#ffffff !important; border:1px solid #2563eb !important;
}
.vi-client-btn:not(.alt):not(.warn):not(.ok):hover:not(:disabled),
.btn-primary:hover:not(:disabled) {background:#1d4ed8 !important; border-color:#1d4ed8 !important;}
/* Ver: azul tenue visible en Clientes, Productos y Proveedores. */
.vi-client-actions button:first-child,
.vi-client-actions button[data-producto-accion="ver"],
.vi-prov-actions button:first-child {
  background:#eaf2ff !important; color:#1d4ed8 !important; border:1px solid #c7dcff !important;
}
.vi-client-actions button:first-child:hover:not(:disabled),
.vi-client-actions button[data-producto-accion="ver"]:hover:not(:disabled),
.vi-prov-actions button:first-child:hover:not(:disabled) {background:#dbeafe !important;}
/* Cerrar / Cancelar en modales: rojo sobrio como el diseño original. */
.vi-client-footer > button.alt,
.vi-client-footer > button[onclick^="cerrar"],
#cerrarFichaProducto,
#venCerrarDetalle, #venCerrar, #venCancelarAnulacion,
#venCerrarDevolucion, #venCerrarDevolucionParcial {
  background:#dc2626 !important; color:#ffffff !important; border:1px solid #dc2626 !important;
}
.vi-client-footer > button.alt:hover:not(:disabled),
#venCerrarDetalle:hover:not(:disabled), #venCerrar:hover:not(:disabled) {
  background:#b91c1c !important; border-color:#b91c1c !important;
}
/* Anular venta: rojo claro con texto de alto contraste. */
#venAnular {background:#fff1f2 !important;color:#be123c !important;border:1px solid #fda4af !important;}
#venAnular:hover:not(:disabled){background:#ffe4e6 !important;}


/* VICORA - Correcciones finales: cabecera movil y boton Actualizar */
/* Actualizar en barras de Clientes, Productos y Proveedores: celeste visible. */
.vi-client-toolbar > button.vi-client-btn.alt,
.vi-prov-toolbar > button.vi-client-btn.alt,
.module-header button.vi-client-btn.alt[id$="Recargar"],
.module-header button.vi-client-btn.alt[id$="Actualizar"] {
  background: #dbeafe !important;
  color: #1d4ed8 !important;
  border: 1px solid #93c5fd !important;
  font-weight: 700 !important;
}
.vi-client-toolbar > button.vi-client-btn.alt:hover:not(:disabled),
.vi-prov-toolbar > button.vi-client-btn.alt:hover:not(:disabled) {
  background: #bfdbfe !important;
  border-color: #60a5fa !important;
}
/* Abarca botones Actualizar detectados por el pintado dinamico. */
button.vi-accion-actualizar {
  background: #dbeafe !important;
  color: #1d4ed8 !important;
  border: 1px solid #93c5fd !important;
}
button.vi-accion-actualizar:hover:not(:disabled) { background: #bfdbfe !important; }
@media (max-width: 760px) {
  /* Reservar un area propia al nombre del negocio; no puede pisar marca ni avatar. */
  .topbar { padding: 0 12px !important; }
  .app-brand { min-width: 0 !important; flex: 0 0 46px; gap: 0 !important; }
  .app-brand-name { display: none !important; }
  .vicora-logo-top { width: 42px !important; height: 42px !important; }
  .user-area { min-width: 0 !important; flex: 0 0 44px; margin-left: auto; }
  .business-name {
    position: absolute !important;
    left: 68px !important;
    right: 68px !important;
    top: 50% !important;
    width: auto !important;
    max-width: none !important;
    transform: translateY(-50%) !important;
    font-size: clamp(12px, 3.5vw, 17px) !important;
    line-height: 1.15 !important;
    white-space: normal !important;
    overflow-wrap: anywhere !important;
    text-align: center !important;
    padding: 0 3px !important;
  }
  .business-name::after { margin: 6px auto 0 !important; }
}

'use strict';
const SUPABASE_URL='https://nxdimgzcsjnjjdfdpatp.supabase.co';
const SUPABASE_PUBLIC_KEY='sb_publishable_4LbyNm4vT3qBh6v6OIjB4Q_IDb4OpRB';
const ACCESO_URL='https://calderoncristian6481404.github.io/vicora-acceso/';
const $=id=>document.getElementById(id);
let db=null, perfil=null, negocio=null, suscripciones=[];
let clientesActuales=[],clientesBusqueda='',clientesAviso='',clientesError=false,clientesCargando=false;
const nombres={clientes:'Clientes',productos:'Productos',proveedores:'Proveedores',ventas:'Ventas',compras:'Compras',caja:'Caja',cobros:'Cobros',pagos:'Pagos',reportes:'Reportes',presupuestos:'Presupuestos'};
function mensajeBloqueo(texto){$('guard').innerHTML='';const h=document.createElement('h2');h.textContent='VICORA Comercial';const p=document.createElement('p');p.textContent=texto;const b=document.createElement('button');b.textContent='Volver a VICORA Acceso';b.onclick=()=>location.assign(ACCESO_URL);const c=document.createElement('div');c.append(h,p,b);$('guard').append(c);$('guard').style.display='grid';$('sistema').style.display='none';}
async function iniciar(){
 try{
  if(!window.supabase?.createClient)throw new Error('No se pudo cargar Supabase. Comprobá la conexión a Internet.');
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,flowType:'pkce'}});
  const {data:{session},error:sessionError}=await db.auth.getSession();
  if(sessionError)throw sessionError;
  if(!session){mensajeBloqueo('No hay una sesión iniciada. Ingresá primero desde VICORA Acceso.');return;}
  const {data:{user},error:userError}=await db.auth.getUser();
  if(userError||!user){mensajeBloqueo('La sesión no es válida. Volvé a ingresar desde VICORA Acceso.');return;}
  const {data:usuarios,error:e1}=await db.from('usuarios').select('id_usuario,id_negocio,nombre,rol,estado,auth_user_id');
  if(e1)throw e1;
  if(usuarios?.length!==1||usuarios[0].auth_user_id!==user.id)throw new Error('No se encontró un único perfil autorizado. Revisar las políticas RLS.');
  perfil=usuarios[0];if(perfil.estado!=='ACTIVO')throw new Error('La cuenta no está activa.');
  const {data:negocios,error:e2}=await db.from('negocios').select('id_negocio,nombre,estado');
  if(e2)throw e2;
  if(negocios?.length!==1||negocios[0].id_negocio!==perfil.id_negocio)throw new Error('No se encontró un único negocio autorizado. Revisar RLS.');
  negocio=negocios[0];if(negocio.estado&&negocio.estado!=='ACTIVO')throw new Error('El negocio no está activo.');
  const {data:subs,error:e3}=await db.from('suscripciones').select('id_suscripcion,id_negocio,id_sistema,estado,proximo_vencimiento');
  if(e3)throw e3;
  if((subs||[]).some(s=>s.id_negocio!==perfil.id_negocio))throw new Error('Se detectaron suscripciones de otro negocio. Revisar RLS.');
  suscripciones=(subs||[]).filter(s=>s.id_sistema==='SIS-000001');
  if(!suscripciones.length)throw new Error('Este negocio no tiene suscripción a VICORA Comercial.');
  if(!suscripciones.some(s=>['ACTIVA','PRUEBA'].includes(String(s.estado||'').toUpperCase())))throw new Error('La suscripción a VICORA Comercial no está habilitada.');
  // Los módulos se habilitan progresivamente, comenzando por Clientes.
  $('nombreNegocio').textContent=negocio.nombre;
  $('nombreUsuario').textContent=perfil.nombre;
  $('rolUsuario').textContent=perfil.rol;
  $('avatarUsuario').textContent=(perfil.nombre||'V').trim().charAt(0).toUpperCase();
  $('guard').style.display='none';$('sistema').style.display='block';mostrarInicio(document.querySelector('.sidebar .menu-item'));
 }catch(err){mensajeBloqueo('No se pudo habilitar el panel: '+String(err?.message||err));}
}
function seleccionar(boton){document.querySelectorAll('.sidebar .menu-item').forEach(b=>b.classList.remove('active'));if(boton)boton.classList.add('active');}

// Notificaciones modernas y reutilizables en VICORA.
function notificarVicora(titulo, mensaje='', tipo='info'){
 const area=document.getElementById('vicoraToastArea');if(!area)return;
 const tipos={exito:['✓','Éxito'],error:['!','Error'],advertencia:['⚠','Advertencia'],info:['i','Información']};
 const clase=Object.prototype.hasOwnProperty.call(tipos,tipo)?tipo:'info';
 const toast=document.createElement('div');toast.className='vicora-toast '+clase;toast.setAttribute('role',clase==='error'?'alert':'status');
 const ico=document.createElement('span');ico.className='vicora-toast-icon';ico.textContent=tipos[clase][0];ico.setAttribute('aria-hidden','true');
 const contenido=document.createElement('div');contenido.className='vicora-toast-content';
 const encabezado=document.createElement('div');encabezado.className='vicora-toast-title';encabezado.textContent=String(titulo||tipos[clase][1]);
 const detalle=document.createElement('div');detalle.className='vicora-toast-message';detalle.textContent=String(mensaje||'');
 contenido.append(encabezado,detalle);
 const cerrar=document.createElement('button');cerrar.type='button';cerrar.className='vicora-toast-close';cerrar.textContent='×';cerrar.setAttribute('aria-label','Cerrar notificación');
 let temporizador;const quitar=()=>{clearTimeout(temporizador);if(!toast.isConnected)return;toast.classList.add('vicora-toast-out');setTimeout(()=>toast.remove(),220)};
 cerrar.addEventListener('click',quitar);toast.append(ico,contenido,cerrar);area.prepend(toast);
 while(area.children.length>3)area.lastElementChild.remove();
 temporizador=setTimeout(quitar,clase==='error'?8000:5000);
}

// CLIENTES · Consultas y escrituras bajo la sesión real y RLS de Supabase.
function clienteMensaje(texto,error=false){clientesAviso=texto;clientesError=error;const el=$('clientesMensaje');if(el){el.textContent='';el.hidden=true;}if(texto)notificarVicora(error?'Operación no completada':'Operación realizada',texto,error?'error':'exito');}
function clienteFecha(value){if(!value)return '—';const d=new Date(value);return Number.isNaN(d.getTime())?'—':d.toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'});}
function clienteBuscarTexto(){const input=$('clientesBuscar');clientesBusqueda=input?input.value:'';pintarTablaClientes();}
async function clienteVerificarAcceso(){
 const {data:{user},error:ue}=await db.auth.getUser();if(ue||!user||user.id!==perfil.auth_user_id)throw new Error('La sesión cambió. Volvé a ingresar.');
 const {data:ps,error:pe}=await db.from('usuarios').select('id_negocio,estado,auth_user_id');
 if(pe||ps?.length!==1||ps[0].auth_user_id!==user.id||ps[0].id_negocio!==perfil.id_negocio||ps[0].estado!=='ACTIVO')throw new Error('Tu usuario ya no está autorizado.');
 const {data:ss,error:se}=await db.from('suscripciones').select('id_negocio,id_sistema,estado,proximo_vencimiento');
 if(se)throw se;
 if(!(ss||[]).some(s=>s.id_negocio===perfil.id_negocio&&s.id_sistema==='SIS-000001'&&['ACTIVA','PRUEBA'].includes(String(s.estado||'').toUpperCase())))throw new Error('La suscripción no está habilitada.');
}
async function obtenerClientesDB(){
 await clienteVerificarAcceso();
 const {data,error}=await db.from('clientes').select('id_negocio,id_cliente,nombre,apellido,documento,telefono,email,direccion,localidad,provincia,fecha_alta,estado').eq('id_negocio',perfil.id_negocio).order('fecha_alta',{ascending:false}).limit(1000);
 if(error)throw error;
 if((data||[]).some(c=>c.id_negocio!==perfil.id_negocio))throw new Error('RLS devolvió datos de otro negocio. Se bloqueó la operación.');
 return data||[];
}
async function mostrarClientes(boton){
 seleccionar(boton);clientesBusqueda='';clientesAviso='';clientesCargando=true;
 $('contenidoPrincipal').innerHTML=`<h1 class="page-title">Clientes</h1><p class="page-subtitle">Gestión de clientes · ${esc(negocio.nombre)}</p><div class="vi-client-toolbar"><input id="clientesBuscar" type="search" placeholder="Buscar por nombre, documento, teléfono..." oninput="clienteBuscarTexto()" aria-label="Buscar clientes"><button class="vi-client-btn" type="button" onclick="abrirClienteFormulario()">+ Nuevo cliente</button><button class="vi-client-btn alt" type="button" onclick="recargarClientes()">Actualizar</button></div><div id="clientesMensaje" class="vi-client-alert" hidden></div><div id="clientesListado" class="vi-client-table-wrap"><p style="padding:25px">Cargando clientes...</p></div><div id="clientesModal"></div>`;
 await recargarClientes();
}

 const lista=$('clientesListado');if(!lista)return;
 lista.innerHTML='<p style="padding:25px">Consultando PostgreSQL...</p>';
 try{clientesActuales=await obtenerClientesDB();pintarTablaClientes();}catch(e){lista.innerHTML='';clienteMensaje('No se pudieron cargar los clientes: '+String(e.message||e),true);}
}
function pintarTablaClientes(){
 const lista=$('clientesListado');if(!lista)return;
 const q=clientesBusqueda.trim().toLocaleLowerCase('es');
 const items=clientesActuales.filter(c=>!q||[c.id_cliente,c.nombre,c.apellido,c.documento,c.telefono,c.email,c.localidad].join(' ').toLocaleLowerCase('es').includes(q));
 const activos=clientesActuales.filter(c=>c.estado==='ACTIVO').length;
 lista.innerHTML=`<div class="vi-client-count" style="padding:15px 15px 0">Mostrando ${items.length} de ${clientesActuales.length} registros · ${activos} activos</div>${items.length?`<table class="vi-client-table"><thead><tr><th>ID</th><th>Nombre y apellido</th><th>Documento</th><th>Teléfono</th><th>Email</th><th>Localidad</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${items.map(c=>`<tr><td>${esc(c.id_cliente)}</td><td><strong>${esc(c.nombre)} ${esc(c.apellido)}</strong></td><td>${esc(c.documento||'—')}</td><td>${esc(c.telefono||'—')}</td><td>${esc(c.email||'—')}</td><td>${esc(c.localidad||'—')}</td><td><span class="vi-client-status ${c.estado==='ACTIVO'?'':'off'}">${esc(c.estado)}</span></td><td><div class="vi-client-actions"><button onclick="verFichaCliente('${esc(c.id_cliente)}')">Ver</button><button onclick="abrirClienteFormulario('${esc(c.id_cliente)}')">Editar</button><button onclick="alternarCliente('${esc(c.id_cliente)}')">${c.estado==='ACTIVO'?'Desactivar':'Activar'}</button></div></td></tr>`).join('')}</tbody></table>`:'<p style="padding:25px;color:#64748b">No hay clientes que coincidan con la búsqueda.</p>'}`;

function clientePorId(id){return clientesActuales.find(c=>c.id_cliente===id);}
function cerrarClienteModal(){const m=$('clientesModal');if(m)m.innerHTML='';}
function abrirClienteFormulario(id=''){
 const c=id?clientePorId(id):null;if(id&&!c)return clienteMensaje('No se encontró el cliente.',true);
 const campos=[['nombre','Nombre *'],['apellido','Apellido *'],['documento','Documento'],['telefono','Teléfono'],['email','Correo electrónico'],['direccion','Dirección'],['localidad','Localidad'],['provincia','Provincia']];
 $('clientesModal').innerHTML=`<div class="vi-client-overlay" role="presentation"><div class="vi-client-dialog" role="dialog" aria-modal="true" aria-label="${id?'Editar':'Nuevo'} cliente"><h2>${id?'Editar cliente':'Nuevo cliente'}</h2><form id="clienteForm" onsubmit="guardarCliente(event,'${esc(id)}')"><div class="vi-client-fields">${campos.map(([k,label])=>`<label>${label}<input name="${k}" ${k==='email'?'type="email"':''} ${k==='nombre'||k==='apellido'?'required maxlength="120"':'maxlength="250"'} value="${esc(c?.[k]||(k==='provincia'?'Córdoba':''))}"></label>`).join('')}</div><div id="clienteModalError" class="vi-client-alert err" hidden></div><div class="vi-client-footer"><button type="button" class="vi-client-btn alt" onclick="cerrarClienteModal()">Cancelar</button><button id="guardarClienteBtn" type="submit" class="vi-client-btn">Guardar</button></div></form></div></div>`;
}
async function generarClienteId(){
 const {data,error}=await db.from('clientes').select('id_cliente').eq('id_negocio',perfil.id_negocio).order('id_cliente',{ascending:false}).limit(1);
 if(error)throw error;
 const max=Number((data?.[0]?.id_cliente||'CLI-000000').match(/^CLI-(\d+)$/)?.[1]||0);
 return 'CLI-'+String(max+1).padStart(6,'0');
}
async function guardarCliente(event,id){
 event.preventDefault();const form=$('clienteForm');if(!form)return;
 const btn=$('guardarClienteBtn'),err=$('clienteModalError');btn.disabled=true;err.hidden=true;
 const fd=new FormData(form),v=k=>String(fd.get(k)||'').trim();
 const datos={nombre:v('nombre'),apellido:v('apellido'),documento:v('documento'),telefono:v('telefono'),email:v('email'),direccion:v('direccion'),localidad:v('localidad'),provincia:v('provincia')};
 try{
  if(!datos.nombre||!datos.apellido)throw new Error('Nombre y apellido son obligatorios.');
  await clienteVerificarAcceso();
  let error=null;
  if(id){
   ({error}=await db.from('clientes').update(datos).eq('id_negocio',perfil.id_negocio).eq('id_cliente',id).select('id_cliente').single());
  }else{
   // ID correlativo provisional para la etapa de pruebas. Se reemplazará por una secuencia atómica antes de producción multiusuario.
   const nuevoId=await generarClienteId();
   ({error}=await db.from('clientes').insert({...datos,id_negocio:perfil.id_negocio,id_cliente:nuevoId,estado:'ACTIVO'}).select('id_cliente').single());
  }
  if(error)throw error;
  cerrarClienteModal();await recargarClientes();notificarVicora(id?'Cliente actualizado':'Cliente registrado',id?'Los cambios se guardaron correctamente en PostgreSQL.':'El cliente se guardó correctamente en PostgreSQL.','exito');
 }catch(e){err.textContent='No se pudo guardar: '+String(e.message||e);err.hidden=false;notificarVicora('No se pudo guardar el cliente',String(e.message||e),'error');}finally{if(btn.isConnected)btn.disabled=false;}
}
function verFichaCliente(id){
 const c=clientePorId(id);if(!c)return;
 const campos=[['ID',c.id_cliente],['Nombre',c.nombre],['Apellido',c.apellido],['Documento',c.documento],['Teléfono',c.telefono],['Email',c.email],['Dirección',c.direccion],['Localidad',c.localidad],['Provincia',c.provincia],['Fecha de alta',clienteFecha(c.fecha_alta)],['Estado',c.estado]];
 $('clientesModal').innerHTML=`<div class="vi-client-overlay"><div class="vi-client-dialog" role="dialog" aria-modal="true" aria-label="Ficha de cliente"><h2>Ficha del cliente</h2><div class="vi-client-details">${campos.map(([k,v])=>`<div><small>${esc(k)}</small><strong>${esc(v||'—')}</strong></div>`).join('')}</div><div class="vi-client-footer"><button class="vi-client-btn alt" onclick="cerrarClienteModal()">Cerrar</button><button class="vi-client-btn" onclick="abrirClienteFormulario('${esc(id)}')">Editar</button></div></div></div>`;
}
function confirmarVicora(titulo,descripcion,esPeligroso=false){
 return new Promise(resolve=>{
  const overlay=document.createElement('div');overlay.className='vi-confirm-overlay';
  overlay.innerHTML=`<div class="vi-confirm-box" role="dialog" aria-modal="true" aria-labelledby="viConfirmTitulo"><div class="vi-confirm-icon">?</div><h2 id="viConfirmTitulo"></h2><p id="viConfirmTexto"></p><div class="vi-confirm-actions"><button type="button" class="vi-confirm-cancel">Cancelar</button><button type="button" class="vi-confirm-accept ${esPeligroso?'danger':''}">Confirmar</button></div></div>`;
  overlay.querySelector('#viConfirmTitulo').textContent=titulo;
  overlay.querySelector('#viConfirmTexto').textContent=descripcion;
  const cancelar=overlay.querySelector('.vi-confirm-cancel');const aceptar=overlay.querySelector('.vi-confirm-accept');
  const terminar=valor=>{document.removeEventListener('keydown',tecla);overlay.remove();resolve(valor)};
  const tecla=e=>{if(e.key==='Escape')terminar(false)};
  cancelar.onclick=()=>terminar(false);aceptar.onclick=()=>terminar(true);
  overlay.addEventListener('click',e=>{if(e.target===overlay)terminar(false)});
  document.body.append(overlay);document.addEventListener('keydown',tecla);cancelar.focus();
 });
}
async function alternarCliente(id){
 const c=clientePorId(id);if(!c)return;
 const estado=c.estado==='ACTIVO'?'INACTIVO':'ACTIVO';
 if(!await confirmarVicora(estado==='ACTIVO'?'Activar cliente':'Desactivar cliente',`¿Querés ${estado==='ACTIVO'?'activar':'desactivar'} a ${c.nombre} ${c.apellido}?`,estado!=='ACTIVO'))return;
 try{await clienteVerificarAcceso();const {data,error}=await db.from('clientes').update({estado}).eq('id_negocio',perfil.id_negocio).eq('id_cliente',id).select('id_cliente').single();if(error)throw error;await recargarClientes();notificarVicora(estado==='ACTIVO'?'Cliente activado':'Cliente desactivado','El estado se actualizó correctamente en PostgreSQL.','exito');}catch(e){clienteMensaje('No se pudo cambiar el estado: '+String(e.message||e),true);}
}
async function actualizarContadorInicio(){
 const el=$('inicioClientesContador');if(!el||!db||!perfil)return;
 try{await clienteVerificarAcceso();const {count,error}=await db.from('clientes').select('id_cliente',{count:'exact',head:true}).eq('id_negocio',perfil.id_negocio).eq('estado','ACTIVO');if(error)throw error;if(el.isConnected)el.textContent=String(count??0);}catch(e){if(el.isConnected)el.textContent='—';}
}

let productosActuales=[],productosBusqueda='',productosPagina=1;
const PRODUCTOS_POR_PAGINA=15;
const PRODUCTOS_UNIDADES=['Unidad','Kg','Gramo','Litro','Mililitro','Metro','Centímetro','Metro cuadrado','Metro cúbico','Paquete','Caja','Bolsa','Docena','Par','Rollo','Servicio','Otro'];

// La verificación en pantalla complementa RLS: PostgreSQL decide los permisos.
async function productoVerificarAcceso(){await clienteVerificarAcceso();}
function productoMoneda(valor){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(Number(valor||0));}
function productoCantidad(valor){return new Intl.NumberFormat('es-AR',{maximumFractionDigits:3}).format(Number(valor||0));}
function productoEstadoStock(p){
 const stock=Number(p.stock||0),min=Number(p.stock_minimo||0);
 if(stock<=0)return {clase:'agotado',texto:'Sin stock'};
 if(stock<=min)return {clase:'bajo',texto:'Stock bajo'};
 return {clase:'',texto:'Disponible'};
}
function productoPorId(id){return productosActuales.find(p=>p.id_producto===id);}
async function obtenerProductosDB(){
 await productoVerificarAcceso();
 const todos=[];let desde=0;
 while(true){
  const {data,error}=await db.from('productos').select('id_negocio,id_producto,codigo,nombre,descripcion,categoria,unidad_medida,marca,unidad,precio_compra,precio_venta,stock,stock_minimo,fecha_alta,estado').eq('id_negocio',perfil.id_negocio).order('id_producto',{ascending:true}).range(desde,desde+999);
  if(error)throw error;
  if((data||[]).some(p=>p.id_negocio!==perfil.id_negocio))throw new Error('La consulta devolvió productos de otro negocio. Operación bloqueada.');
  todos.push(...(data||[]));
  if(!data||data.length<1000)break;
  desde+=1000;
 }
 return todos;
}
async function mostrarProductos(boton){
 seleccionar(boton);productosBusqueda='';productosPagina=1;
 $('contenidoPrincipal').innerHTML=`<h1 class="page-title">Productos</h1><p class="page-subtitle">Catálogo, precios y control de stock · ${esc(negocio.nombre)}</p><div class="vi-client-toolbar"><input id="productosBuscar" type="search" placeholder="Buscar por código de barras, nombre, marca, categoría..." aria-label="Buscar productos" oninput="productoBuscarTexto()"><button class="vi-client-btn" type="button" onclick="abrirProductoFormulario()">+ Nuevo producto</button><button class="vi-client-btn alt" type="button" onclick="recargarProductos()">Actualizar</button></div><div id="productosResumen"></div><div id="productosListado" class="vi-client-table-wrap"><p style="padding:25px">Cargando productos...</p></div><div id="productosModal"></div>`;
 await recargarProductos();
}
async function recargarProductos(){
 const lista=$('productosListado');if(!lista)return;
 lista.innerHTML='<p style="padding:25px">Consultando productos en PostgreSQL...</p>';
 try{productosActuales=await obtenerProductosDB();pintarTablaProductos();}
 catch(e){lista.innerHTML=`<p class="vi-client-alert err" style="margin:15px">${esc('No se pudieron cargar los productos: '+String(e.message||e))}</p>`;notificarVicora('Error al consultar productos',String(e.message||e),'error');}
}
function productoBuscarTexto(){productosBusqueda=$('productosBuscar')?.value||'';productosPagina=1;pintarTablaProductos();}
function productoCambiarPagina(n){productosPagina=n;pintarTablaProductos();}
function pintarTablaProductos(){
 const lista=$('productosListado');if(!lista)return;
 const q=productosBusqueda.trim().toLocaleLowerCase('es');
 const items=productosActuales.filter(p=>!q||[p.id_producto,p.codigo,p.nombre,p.descripcion,p.categoria,p.marca,p.unidad_medida,p.unidad].join(' ').toLocaleLowerCase('es').includes(q));
 const activos=productosActuales.filter(p=>p.estado==='ACTIVO');
 const bajo=activos.filter(p=>Number(p.stock||0)<=Number(p.stock_minimo||0));
 const resumen=$('productosResumen');
 if(resumen)resumen.innerHTML=`<div class="vi-producto-summary"><span class="vi-producto-chip">Total: <strong>${productosActuales.length}</strong></span><span class="vi-producto-chip">Activos: <strong>${activos.length}</strong></span><span class="vi-producto-chip">Stock bajo o agotado: <strong>${bajo.length}</strong></span></div>`;
 const paginas=Math.max(1,Math.ceil(items.length/PRODUCTOS_POR_PAGINA));productosPagina=Math.min(productosPagina,paginas);
 const visibles=items.slice((productosPagina-1)*PRODUCTOS_POR_PAGINA,productosPagina*PRODUCTOS_POR_PAGINA);
 lista.innerHTML=`<div class="vi-client-count" style="padding:15px 15px 0">Mostrando ${visibles.length} de ${items.length} coincidencias</div>${visibles.length?`<table class="vi-client-table"><thead><tr><th>ID</th><th>Código</th><th>Producto</th><th>Categoría / Marca</th><th>Unidad</th><th>Compra</th><th>Venta</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${visibles.map(p=>{const st=productoEstadoStock(p);return `<tr><td>${esc(p.id_producto)}</td><td>${esc(p.codigo||'—')}</td><td><strong>${esc(p.nombre)}</strong></td><td>${esc(p.categoria||'—')}<br><small>${esc(p.marca||'')}</small></td><td>${esc(p.unidad_medida||'Unidad')}</td><td>${esc(productoMoneda(p.precio_compra))}</td><td>${esc(productoMoneda(p.precio_venta))}</td><td><strong>${esc(productoCantidad(p.stock))}</strong><br><span class="vi-producto-stock ${st.clase}">${st.texto}</span></td><td><span class="vi-client-status ${p.estado==='ACTIVO'?'':'off'}">${esc(p.estado)}</span></td><td><div class="vi-client-actions"><button type="button" data-producto-accion="ver" data-producto-id="${esc(p.id_producto)}">Ver</button><button type="button" data-producto-accion="editar" data-producto-id="${esc(p.id_producto)}">Editar</button><button type="button" data-producto-accion="ajustar" data-producto-id="${esc(p.id_producto)}" ${p.estado!=='ACTIVO'?'disabled title="Solo productos activos"':''}>Ajustar stock</button><button type="button" data-producto-accion="estado" data-producto-id="${esc(p.id_producto)}">${p.estado==='ACTIVO'?'Desactivar':'Activar'}</button></div></td></tr>`}).join('')}</tbody></table>`:'<p style="padding:25px;color:#64748b">No hay productos que coincidan con la búsqueda.</p>'}${paginas>1?`<div class="vicora-ver-mas"><button type="button" class="vi-client-btn alt" onclick="productoCambiarPagina(${productosPagina-1})" ${productosPagina===1?'disabled':''}>Anterior</button><span>Página ${productosPagina} de ${paginas}</span><button type="button" class="vi-client-btn alt" onclick="productoCambiarPagina(${productosPagina+1})" ${productosPagina===paginas?'disabled':''}>Siguiente</button></div>`:''}`;
 // Delegación: evita insertar IDs en expresiones JavaScript generadas.
 lista.querySelectorAll('[data-producto-accion]').forEach(b=>b.addEventListener('click',()=>{
  const id=b.dataset.productoId;
  if(b.dataset.productoAccion==='ver')verFichaProducto(id);
  if(b.dataset.productoAccion==='editar')abrirProductoFormulario(id);
  if(b.dataset.productoAccion==='ajustar')abrirAjusteStock(id);
  if(b.dataset.productoAccion==='estado')alternarProducto(id);
 }));
}
function cerrarProductoModal(){const m=$('productosModal');if(m)m.innerHTML='';}
function abrirProductoFormulario(id=''){
 const p=id?productoPorId(id):null;
 if(id&&!p){notificarVicora('Producto no encontrado','Actualizá el listado e intentá nuevamente.','error');return;}
 const campos=[['codigo','Código de barras / Código comercial','text'],['nombre','Nombre *','text'],['descripcion','Descripción','text'],['categoria','Categoría','text'],['marca','Marca','text'],['precio_compra','Precio de compra','number'],['precio_venta','Precio de venta','number'],['stock','Stock inicial','number'],['stock_minimo','Stock mínimo','number']];
 const input=([k,label,t])=>`<label>${esc(label)}<input name="${k}" type="${t}" ${t==='number'?'step="0.001" min="0" inputmode="decimal"':'maxlength="250"'} ${k==='nombre'?'required':''} value="${esc(p?.[k]??(t==='number'?'0':''))}"></label>`;
 const presentaciones=['Botella','Caja','Paquete','Bolsa','Lata','Bidón','Rollo','A granel','Frasco','Pote','Sachet','Blíster','Unidad individual'];
 const presentacionActual=String(p?.unidad||'');
 const presentacionBase=presentaciones.includes(presentacionActual)?presentacionActual:(presentacionActual?'Personalizada':'');
 const presentacionSelector=`<label>Presentación del producto (opcional)<select id="productoPresentacionTipo"><option value="">Seleccionar presentación</option>${presentaciones.map(x=>`<option value="${esc(x)}" ${x===presentacionBase?'selected':''}>${esc(x)}</option>`).join('')}<option value="Personalizada" ${presentacionBase==='Personalizada'?'selected':''}>Otra / Personalizada</option></select></label><label id="productoPresentacionDetalleWrap">Detalle de presentación (opcional)<input id="productoPresentacionDetalle" name="unidad" type="text" maxlength="250" placeholder="Ej.: Botella de 2,25 litros" value="${esc(presentacionActual)}"></label>`;
 const unidades=PRODUCTOS_UNIDADES.includes(p?.unidad_medida)?PRODUCTOS_UNIDADES:[...PRODUCTOS_UNIDADES,String(p?.unidad_medida||'Unidad')];
 $('productosModal').innerHTML=`<div class="vi-client-overlay"><div class="vi-client-dialog" role="dialog" aria-modal="true" aria-label="${id?'Editar':'Nuevo'} producto"><h2>${id?'Editar producto':'Nuevo producto'}</h2><form id="productoForm"><div class="vi-client-fields vi-producto-fields">${campos.slice(0,5).map(input).join('')}<label>Unidad de medida *<select name="unidad_medida" required>${unidades.map(u=>`<option value="${esc(u)}" ${u===(p?.unidad_medida||'Unidad')?'selected':''}>${esc(u)}</option>`).join('')}</select></label>${presentacionSelector}${campos.slice(5).filter(([k])=>!id||k!=='stock').map(input).join('')}${id?`<div style="grid-column:1/-1;padding:12px;border:1px solid #bfdbfe;border-radius:9px;background:#eff6ff;color:#1e40af;font-size:13px"><strong>Stock actual: ${esc(productoCantidad(p.stock))}</strong><div style="margin-top:5px">Las existencias no se modifican al editar este producto. Usá el botón «Ajustar stock» del listado para registrar entradas o salidas.</div></div>`:''}</div><div id="productoModalError" class="vi-client-alert err" hidden></div><div class="vi-client-footer"><button type="button" class="vi-client-btn alt" id="cancelarProductoBtn">Cancelar</button><button id="guardarProductoBtn" type="submit" class="vi-client-btn">Guardar</button></div></form></div></div>`;
 const tipoPresentacion=$('productoPresentacionTipo');
 const detallePresentacion=$('productoPresentacionDetalle');
 tipoPresentacion.addEventListener('change',()=>{
  const tipo=tipoPresentacion.value;
  if(!tipo){detallePresentacion.value='';detallePresentacion.placeholder='Ej.: Botella de 2,25 litros';return;}
  if(tipo==='Personalizada'){
   detallePresentacion.value='';detallePresentacion.placeholder='Escribí la presentación';detallePresentacion.focus();
  }else{
   detallePresentacion.value=tipo;
   detallePresentacion.placeholder=`Ej.: ${tipo} de 1 kg`;
  }
 });
 $('cancelarProductoBtn').addEventListener('click',cerrarProductoModal);
 $('productoForm').addEventListener('submit',e=>guardarProducto(e,id));
 const codigoInput=$('productoForm').querySelector('[name="codigo"]');
 codigoInput.setAttribute('autocomplete','off');
 codigoInput.setAttribute('placeholder','Escaneá con lector USB o escribí el código');
 codigoInput.setAttribute('aria-label','Código de barras o código comercial');
 codigoInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('productoForm').querySelector('[name="nombre"]').focus();}});
 if(!id)codigoInput.focus();else $('productoForm').querySelector('[name="nombre"]').focus();
}
async function guardarProducto(event,id){
 event.preventDefault();const form=$('productoForm');if(!form)return;
 const btn=$('guardarProductoBtn'),err=$('productoModalError');btn.disabled=true;err.hidden=true;
 const fd=new FormData(form),v=k=>String(fd.get(k)||'').trim();
 const num=k=>{const raw=v(k);if(raw==='')return 0;const n=Number(raw);if(!Number.isFinite(n)||n<0)throw new Error('Revisá el valor de '+k.replaceAll('_',' ')+'.');return n;};
 try{
  const datos={codigo:v('codigo'),nombre:v('nombre'),descripcion:v('descripcion'),categoria:v('categoria'),unidad_medida:v('unidad_medida'),marca:v('marca'),unidad:v('unidad'),precio_compra:num('precio_compra'),precio_venta:num('precio_venta'),stock_minimo:num('stock_minimo')};
  if(!id)datos.stock=num('stock');
  if(!datos.nombre)throw new Error('El nombre del producto es obligatorio.');
  if(!datos.unidad_medida)throw new Error('Seleccioná la unidad de medida.');
  await productoVerificarAcceso();
  if(datos.codigo){
   const {data:repetido,error:codigoError}=await db.from('productos').select('id_producto').eq('id_negocio',perfil.id_negocio).eq('codigo',datos.codigo).limit(1);
   if(codigoError)throw codigoError;
   if((repetido||[]).some(p=>p.id_producto!==id))throw new Error('Ya existe un producto con ese código en este negocio.');
  }
  let resultado;
  if(id)resultado=await db.from('productos').update(datos).eq('id_negocio',perfil.id_negocio).eq('id_producto',id).select('id_producto').single();
  else resultado=await db.from('productos').insert({...datos,id_negocio:perfil.id_negocio,estado:'ACTIVO'}).select('id_producto').single();
  if(resultado.error){
   if(resultado.error.code==='23505'&&datos.codigo)throw new Error('El código de barras ya está registrado en este negocio.');
   throw resultado.error;
  }
  cerrarProductoModal();await recargarProductos();
  notificarVicora(id?'Producto actualizado':'Producto registrado','Los datos se guardaron correctamente en PostgreSQL.','exito');
 }catch(e){err.textContent='No se pudo guardar: '+String(e.message||e);err.hidden=false;notificarVicora('No se pudo guardar el producto',String(e.message||e),'error');}
 finally{if(btn.isConnected)btn.disabled=false;}
}
// PASO 68.22 — Ajustes manuales de stock mediante RPC segura de Supabase.
function abrirAjusteStock(id){
 const p=productoPorId(id);
 if(!p||p.estado!=='ACTIVO'){notificarVicora('Producto no disponible','Solo se puede ajustar stock de productos activos.','advertencia');return;}
 $('productosModal').innerHTML=`<div class="vi-client-overlay"><div class="vi-client-dialog" role="dialog" aria-modal="true" aria-label="Ajustar stock"><h2>Ajustar stock</h2><p style="color:#475569;font-size:13px;margin-bottom:16px"><strong>${esc(p.nombre)}</strong> · ${esc(p.id_producto)}<br>Stock actual: <strong>${esc(productoCantidad(p.stock))} ${esc(p.unidad_medida||'')}</strong></p><form id="ajusteStockForm"><div class="vi-client-fields vi-producto-fields"><label>Movimiento *<select name="tipo" required><option value="ENTRADA">Entrada (+)</option><option value="SALIDA">Salida (−)</option></select></label><label>Cantidad *<input type="number" name="cantidad" min="0.001" step="0.001" inputmode="decimal" required placeholder="Ej.: 5"></label><label style="grid-column:1/-1">Motivo *<input name="motivo" type="text" minlength="3" maxlength="250" required placeholder="Ej.: Corrección de inventario"></label></div><div id="ajusteStockError" class="vi-client-alert err" hidden></div><div class="vi-client-footer"><button type="button" class="vi-client-btn alt" id="cancelarAjusteStock">Cancelar</button><button type="submit" class="vi-client-btn" id="confirmarAjusteStock">Confirmar ajuste</button></div></form></div></div>`;
 $('cancelarAjusteStock').addEventListener('click',cerrarProductoModal);
 $('ajusteStockForm').addEventListener('submit',async event=>{
  event.preventDefault();
  const form=event.currentTarget,btn=$('confirmarAjusteStock'),errorEl=$('ajusteStockError');
  const fd=new FormData(form),tipo=String(fd.get('tipo')||''),cantidad=Number(fd.get('cantidad')),motivo=String(fd.get('motivo')||'').trim();
  errorEl.hidden=true;
  if(!['ENTRADA','SALIDA'].includes(tipo)||!Number.isFinite(cantidad)||cantidad<=0||motivo.length<3){errorEl.textContent='Completá el tipo, una cantidad mayor a cero y un motivo de al menos 3 caracteres.';errorEl.hidden=false;return;}
  const ok=await confirmarVicora('Confirmar ajuste de stock',`¿Querés registrar ${tipo==='ENTRADA'?'una entrada':'una salida'} de ${productoCantidad(cantidad)} unidades para «${p.nombre}»? Motivo: ${motivo}`,tipo==='SALIDA');
  if(!ok)return;
  btn.disabled=true;
  try{
   await productoVerificarAcceso();
   const {data,error}=await db.rpc('ajustar_stock',{p_id_negocio:perfil.id_negocio,p_id_producto:p.id_producto,p_tipo:tipo,p_cantidad:cantidad,p_motivo:motivo});
   if(error)throw error;
   if(!data||data.ok!==true)throw new Error('No se pudo confirmar el movimiento.');
   cerrarProductoModal();await recargarProductos();
   notificarVicora('Stock actualizado',`Stock anterior: ${productoCantidad(data.stock_anterior)} · Nuevo stock: ${productoCantidad(data.stock_nuevo)}`,'exito');
  }catch(e){errorEl.textContent='No se pudo ajustar el stock: '+String(e.message||e);errorEl.hidden=false;notificarVicora('Error al ajustar stock',String(e.message||e),'error');}
  finally{if(btn.isConnected)btn.disabled=false;}
 });
}
function verFichaProducto(id){
 const p=productoPorId(id);if(!p)return;
 const campos=[['ID',p.id_producto],['Código de barras / Código comercial',p.codigo],['Nombre',p.nombre],['Descripción',p.descripcion],['Categoría',p.categoria],['Marca',p.marca],['Unidad de medida',p.unidad_medida],['Presentación del producto',p.unidad],['Precio de compra',productoMoneda(p.precio_compra)],['Precio de venta',productoMoneda(p.precio_venta)],['Stock actual',productoCantidad(p.stock)],['Stock mínimo',productoCantidad(p.stock_minimo)],['Fecha de alta',clienteFecha(p.fecha_alta)],['Estado',p.estado]];
 $('productosModal').innerHTML=`<div class="vi-client-overlay"><div class="vi-client-dialog" role="dialog" aria-modal="true" aria-label="Ficha de producto"><h2>Ficha del producto</h2><div class="vi-client-details">${campos.map(([k,v])=>`<div><small>${esc(k)}</small><strong>${esc(v??'—')}</strong></div>`).join('')}</div><div class="vi-client-footer"><button class="vi-client-btn alt" type="button" id="cerrarFichaProducto">Cerrar</button><button class="vi-client-btn" type="button" id="editarFichaProducto">Editar</button></div></div></div>`;
 $('cerrarFichaProducto').addEventListener('click',cerrarProductoModal);
 $('editarFichaProducto').addEventListener('click',()=>abrirProductoFormulario(id));
}
async function alternarProducto(id){
 const p=productoPorId(id);if(!p)return;
 const estado=p.estado==='ACTIVO'?'INACTIVO':'ACTIVO';
 const ok=await confirmarVicora(estado==='ACTIVO'?'Activar producto':'Desactivar producto',`¿Querés ${estado==='ACTIVO'?'activar':'desactivar'} el producto «${p.nombre}»?`,estado!=='ACTIVO');
 if(!ok)return;
 try{
  await productoVerificarAcceso();
  const {error}=await db.from('productos').update({estado}).eq('id_negocio',perfil.id_negocio).eq('id_producto',id).select('id_producto').single();
  if(error)throw error;
  await recargarProductos();notificarVicora(estado==='ACTIVO'?'Producto activado':'Producto desactivado','El estado se actualizó correctamente.','exito');
 }catch(e){notificarVicora('No se pudo cambiar el estado',String(e.message||e),'error');}
}
async function actualizarContadorProductosInicio(){
 const el=$('inicioProductosContador');if(!el||!db||!perfil)return;
 try{
  await productoVerificarAcceso();
  const {count,error}=await db.from('productos').select('id_producto',{count:'exact',head:true}).eq('id_negocio',perfil.id_negocio).eq('estado','ACTIVO');
  if(error)throw error;
  if(el.isConnected)el.textContent=String(count??0);
 }catch(e){if(el.isConnected)el.textContent='—';}
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function cerrarSesion(){try{if(db)await db.auth.signOut();}finally{location.assign(ACCESO_URL);}}

/* VICORA · Identifica acciones por su texto visible, también en módulos externos.
   No cambia eventos, atributos de datos ni lógica de los botones. */
(function vicoraColorearBotones(){
  const mapa = [
    [/^ver$/i,'ver'],
    [/^editar$/i,'editar'],
    [/^desactivar$/i,'desactivar'],
    [/^activar$/i,'activar'],
    [/^ajustar\s+stock$/i,'ajustar'],
    [/^cancelar$/i,'cancelar'],
    [/^anular(?:\s+\w+)?$/i,'anular'],
    [/^actualizar$/i,'actualizar']
  ];
  const clases = ['vi-accion-color',...mapa.map(x=>'vi-accion-'+x[1])];
  function pintar(raiz){
    const botones = raiz.nodeType===1 && raiz.matches?.('button')
      ? [raiz,...raiz.querySelectorAll('button')]
      : raiz.querySelectorAll ? raiz.querySelectorAll('button') : [];
    for(const boton of botones){
      const texto=(boton.textContent||'').replace(/\s+/g,' ').trim();
      const tipo=mapa.find(([patron])=>patron.test(texto))?.[1];
      if(!tipo) continue;
      // Evitar alterar botones del menú de navegación.
      if(boton.closest('.sidebar')) continue;
      const deseada='vi-accion-'+tipo;
      if(boton.classList.contains(deseada)) continue;
      boton.classList.remove(...clases);
      boton.classList.add('vi-accion-color',deseada);
    }
  }
  pintar(document);
  const observador = new MutationObserver(cambios=>{
    for(const cambio of cambios){
      if(cambio.type==='characterData'){
        const boton=cambio.target.parentElement?.closest('button');
        if(boton) pintar(boton);
      }
      for(const nodo of cambio.addedNodes){
        if(nodo.nodeType===1) pintar(nodo);
      }
    }
  });
  observador.observe(document.body,{childList:true,subtree:true,characterData:true});
})();
